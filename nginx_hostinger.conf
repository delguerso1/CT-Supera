# Configuração para acesso via IP (HTTP apenas)
server {
    listen 80;
    server_name 72.60.145.13;
    
    # Root do frontend
    root /root/ct-supera/ct-supera-frontend/build;
    index index.html;
    
    # Servir arquivos estáticos do React (prioridade)
    location /static/ {
        alias /root/ct-supera/ct-supera-frontend/build/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Servir arquivos estáticos do Django Admin (rota específica)
    location /static/admin/ {
        alias /root/ct-supera/staticfiles/admin/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Servir arquivos estáticos do Django REST Framework
    location /static/rest_framework/ {
        alias /root/ct-supera/staticfiles/rest_framework/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Servir arquivos de mídia
    location /media/ {
        alias /root/ct-supera/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # API do Django - ATUALIZADO: usando porta 8001 (mesma do service)
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Admin do Django - ATUALIZADO: usando porta 8001 (mesma do service)
    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Servir frontend React (SPA) - index.html sem cache para garantir atualizações após deploy
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # index.html explícito - sem cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # Configurações de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Limitar tamanho de upload
    client_max_body_size 10M;
    
    # Logs específicos para esta aplicação
    access_log /var/log/nginx/ctsupera_ip_access.log;
    error_log /var/log/nginx/ctsupera_ip_error.log;
}

# HTTP → HTTPS no host canônico (301 permanente, nunca 302).
# Host explícito: $server_name acompanharia o primeiro nome do bloco e poderia
# manter www ou um IP na URL indexada.
server {
    listen 80;
    server_name ctsupera.com.br www.ctsupera.com.br;

    return 301 https://ctsupera.com.br$request_uri;
}

# www em HTTPS também vai para o ápice. Sem este bloco, https://www responde 200
# e duplica a home.
server {
    listen 443 ssl http2;
    server_name www.ctsupera.com.br;

    ssl_certificate /etc/letsencrypt/live/ctsupera.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctsupera.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://ctsupera.com.br$request_uri;
}

# Configuração HTTPS (domínio canônico)
server {
    listen 443 ssl http2;
    server_name ctsupera.com.br;
    
    # Certificados SSL (verificar se existem antes de ativar)
    # Se os certificados não existirem, execute: certbot --nginx -d ctsupera.com.br -d www.ctsupera.com.br
    ssl_certificate /etc/letsencrypt/live/ctsupera.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctsupera.com.br/privkey.pem;
    
    # Configurações SSL modernas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Root do frontend
    root /root/ct-supera/ct-supera-frontend/build;
    index index.html;
    
    # Servir arquivos estáticos do React (prioridade)
    location /static/ {
        alias /root/ct-supera/ct-supera-frontend/build/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Servir arquivos estáticos do Django Admin (rota específica)
    location /static/admin/ {
        alias /root/ct-supera/staticfiles/admin/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Servir arquivos estáticos do Django REST Framework
    location /static/rest_framework/ {
        alias /root/ct-supera/staticfiles/rest_framework/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Servir arquivos de mídia
    location /media/ {
        alias /root/ct-supera/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # API do Django - ATUALIZADO: usando porta 8001 (mesma do service)
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Admin do Django - ATUALIZADO: usando porta 8001 (mesma do service)
    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # HTML da rota em /agendamento/index.html, sem 301 para a barra final.
    # add_header aqui não herda o HSTS do server; o header precisa estar neste bloco.
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    
    # index.html explícito - sem cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    
    # Configurações de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # HSTS só no HTTPS do ápice. Sem includeSubDomains/preload: não força outros subdomínios.
    add_header Strict-Transport-Security "max-age=31536000" always;
    
    client_max_body_size 10M;
    
    access_log /var/log/nginx/ctsupera_ssl_access.log;
    error_log /var/log/nginx/ctsupera_ssl_error.log;
}
